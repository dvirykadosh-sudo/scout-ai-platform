name: בדיקות
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run typecheck
      - run: node run.mjs build-prod
      - name: בדיקות דפדפן
        run: |
          (PORT=5055 NODE_ENV=production JWT_SECRET=testsecret1234567890 ADMIN_PASSWORD=Strong#Pass99 SIGNUP_CODE=maoz2026 DB_PATH=/tmp/e2e.db node backend/src/all.js &)
          sleep 10
          npx playwright-core install chromium
          cd e2e && npm install && CHROMIUM_PATH="$(find ~/.cache/ms-playwright -name chrome -type f | head -1)" npm run all

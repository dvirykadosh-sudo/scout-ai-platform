# Blueprint ל-Render (שלב 66: מתאר את ההגדרה בפועל, התוכנית החינמית עם גיבוי ל-GitHub).
# בתוכנית החינמית אין דיסק קבוע, ולכן הנתונים נשמרים בגיבוי מוצפן למאגר פרטי ב-GitHub (DATA_REPO, DATA_TOKEN, BACKUP_KEY).
# מי שעובר לתוכנית בתשלום ורוצה דיסק קבוע: plan: starter, ובטלו את ההערה על בלוק disk ועל DB_PATH למטה.
# ההרשמה העצמית פתוחה לכולם, ולכן אין יותר SIGNUP_CODE.
services:
  - type: web
    name: maoz-activity-generator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # - key: DB_PATH
      #   value: /data/scout.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # גיבוי מוצפן ל-GitHub (ראו deploy/FREE.md ו-README, שלב 64). BACKUP_KEY: טקסט אקראי של 32 תווים ומעלה, לא משנים אחרי שנקבע.
      - key: DATA_REPO
        sync: false
      - key: DATA_TOKEN
        sync: false
      - key: BACKUP_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

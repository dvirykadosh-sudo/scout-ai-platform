# Blueprint ל-Render: שירות יחיד עם דיסק קבוע למסד הנתונים.
# הערה: דיסק קבוע זמין רק בשירות בתשלום. בלי דיסק, כל הפעלה מחדש מוחקת את הנתונים.
services:
  - type: web
    name: maoz-activity-generator
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/scout.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

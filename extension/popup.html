<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>עוזר שיחות</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>עוזר שיחות</h1>
    <button id="btn-settings" type="button" class="link" aria-expanded="false" aria-controls="settings">הגדרות</button>
  </header>
  <p id="status" role="status" class="hint"></p>

  <section id="settings" hidden aria-label="הגדרות">
    <label for="site">כתובת האתר</label>
    <input id="site" type="url" dir="ltr" placeholder="https://shevet-maoz-app.onrender.com" autocomplete="off">
    <label for="token">אסימון (נוצר באתר: עוזר שיחות, תוסף למחשב)</label>
    <input id="token" type="password" dir="ltr" placeholder="mx_..." autocomplete="off">
    <div class="row">
      <label><input id="kid" type="radio" name="kid" value="n" checked> חניך (בוא/י)</label>
      <label><input type="radio" name="kid" value="m"> בן</label>
      <label><input type="radio" name="kid" value="f"> בת</label>
    </div>
    <div class="row">
      <label><input type="radio" name="guide" value="n" checked> אני (שמח/ה)</label>
      <label><input type="radio" name="guide" value="m"> מדריך</label>
      <label><input type="radio" name="guide" value="f"> מדריכה</label>
    </div>
    <label for="extra">שמות נוספים להסתרה (בפסיקים)</label>
    <input id="extra" type="text" autocomplete="off">
    <div class="row"><button id="btn-save" type="button" class="primary">שמירה ובדיקת חיבור</button></div>
  </section>

  <section id="actions">
    <button id="btn-chat" type="button" class="primary">ניתוח השיחה הפתוחה בוואטסאפ ווב</button>
    <label for="paste">או הודעה בודדת (סימנתם בדף, או הדביקו)</label>
    <textarea id="paste" rows="3" dir="auto"></textarea>
    <button id="btn-text" type="button">ניתוח ההודעה</button>
    <p class="hint">שמות מוחלפים ב"חניך א'", וטלפונים וקישורים נמחקים כאן, במחשב, לפני השליחה לאתר.</p>
  </section>

  <section id="out" aria-live="polite"></section>
  <script type="module" src="popup.js"></script>
</body>
</html>
